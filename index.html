#cannon{background:linear-gradient(#ffd0a8 0 8px,#ff9a66 8px 56%,#f07848 56% 100%)}
#cannon.notready{background:linear-gradient(#d8a890 0 8px,#b88a74 8px 56%,#a07462 56% 100%)}

.hbtn:hover{background:linear-gradient(#8e7cb4 0 50%,#6e5c90 50% 100%)}

<button id="live-audio-start" type="button" hidden>Bật âm thanh cho nguồn phát</button>
<main id="live" hidden>
 <section class="live-arena" aria-label="Chiến trường">
  <div class="arena-meta"><h2 id="live-map"></h2><p id="live-result" role="status" hidden></p></div>
  <div class="live-score">
   <div class="live-team cats"><div><strong>Mèo <span id="live-cat-boost" class="live-boost"></span></strong><span id="live-cat-hp"></span></div><div class="hp"><i id="live-cat-bar"></i></div></div>
   <div class="live-wins" aria-label="Tổng số trận thắng"><strong id="live-wins"></strong><span>Trận thắng</span></div>
   <div class="live-team enemies"><div><strong>Quái <span id="live-enemy-boost" class="live-boost"></span></strong><span id="live-enemy-hp"></span></div><div class="hp"><i id="live-enemy-bar"></i></div></div>
  </div>
  <div id="live-field">
   <p id="live-finisher" role="status" hidden></p>
   <div class="live-updates" aria-live="polite">
    <p id="live-next"></p>
    <p id="live-activity"></p>
   </div>
  </div>

 </section>
 <section class="live-guide" aria-label="Quà và đội hình">
  <header><h2>Quà &amp; đội hình</h2><p id="live-catalog"></p></header>
  <div class="live-support">
   <p class="live-choose-title">💬 BÌNH LUẬN ĐỂ CHỌN ĐỘI!</p>
   <p id="live-team-notice" role="status" hidden><span id="live-team-viewer"></span><span id="live-team-selection"></span></p>
  </div>
  <div class="live-rosters">
   <section class="cats">
    <h3><span>🐱 PHE MÈO</span><span class="live-team-commands"><code>!meow</code> hoặc <code>1</code></span></h3>
    <ul id="live-cat-list"></ul>
   </section>
   <section class="enemies">
    <h3><span>👾 PHE QUÁI</span><span class="live-team-commands"><code>!monster</code> hoặc <code>2</code></span></h3>
    <ul id="live-enemy-list"></ul>
   </section>
  </div>
  <section class="live-skills"><h3>Kỹ năng</h3><ul id="live-skill-list"></ul></section>
  <section class="live-finish"><h3>👑 QUÀ<br>KẾT LIỄU</h3><ul id="live-finish-list"></ul></section>
 </section>
</main>
<div id="game">
 <div id="battleView">
  <canvas id="cv" width="320" height="180"></canvas>
  <div id="bar"></div>
  <div id="banner"></div>
  <div id="flash"></div>
  <div class="ov show" id="menu">
    <div class="panel px">
      <h1 id="ttl"></h1>
      <h2 id="sub"></h2>
      <div class="stages" id="stageList"></div>
      <div class="btn px parkgo" id="btnMenuPark"></div>
      <div class="langs" id="langs1"></div>
      <div class="help" id="help"></div>
      <div class="ver" id="ver">v1.7</div>
    </div>
  </div>
  <div class="ov" id="pause"><div class="panel px"><div class="res" id="pauseT"></div>
    <div class="btn px" id="btnResume"></div><div class="btn px parkgo" id="btnPausePark"></div><div class="btn px alt" id="btnQuit"></div><div class="langs" id="langs2"></div></div></div>
  <div class="ov" id="result"><div class="panel px"><div class="res" id="resTitle"></div><div id="resInfo" class="help"></div><br>
    <div class="btn px" id="btnNext"></div><div class="btn px alt" id="btnRetry"></div><div class="btn px parkgo" id="btnResPark"></div><div class="btn px alt" id="btnMenu"></div></div></div>
 </div>
 <div id="park" style="display:none">
  <canvas id="parkcv" width="320" height="180"></canvas>
  <div id="hint"><strong></strong><span id="hintText"></span></div>
  <div id="corner"><button class="pixel-btn primary" id="buildBtn"></button><button class="pixel-btn" id="helpBtn">?</button></div>
  <div id="shop"><header><span id="shopTitle"></span><button id="closeShop" aria-label="close">×</button></header><p id="shopDesc"></p><p id="shopFree"></p>
   <button class="build-card" data-building="feather"><span class="glyph">🪶</span><span><strong></strong><span class="desc"></span><span class="cost"></span></span></button>
   <button class="build-card" data-building="beds"><span class="glyph">☁️</span><span><strong></strong><span class="desc"></span><span class="cost"></span></span></button>
   <button class="build-card" data-building="house"><span class="glyph">🪵</span><span><strong></strong><span class="desc"></span><span class="cost"></span></span></button>
   <div id="shopfooter"></div>
  </div>
  <div id="placement"><div id="placementText"></div><div id="placementActions"><button class="pixel-btn pink" id="cancelBtn"></button><button class="pixel-btn success" id="confirmBtn"></button></div></div>
  <div id="info"><strong id="infoTitle"></strong><p id="infoBody"></p><button id="closeInfo"></button></div>
  <div id="toast" role="status"></div>
  <button class="pixel-btn" id="heroChip" style="display:none"><span class="crown" aria-hidden="true">♛</span><span id="heroChipName"></span></button>
  <div id="heroCard"><header><span class="crown" aria-hidden="true">♛</span><strong id="hcName"></strong><button id="hcClose" aria-label="close">×</button></header>
   <div class="hcRow"><canvas id="hcPic" width="40" height="24"></canvas><div><div id="hcType"></div><div id="hcStars"></div></div></div>
   <div id="hcStats"></div><p id="hcState"></p><button class="pixel-btn" id="hcFollow"></button></div>
  <button class="pixel-btn" id="parkBack"></button>
 </div>
 <div id="hud">
    <div class="pill px" id="stageName"></div>
    <div class="pill px" id="money">♥ 0</div>
    <div class="sp"></div>
    <div class="tabs px"><div class="tab" id="tabB"></div><div class="tab" id="tabP"></div></div>
    <div class="sp"></div>
    <div class="pill px" id="plots"></div>
    <div class="pill px hbtn" id="btnFx"></div>
    <div class="pill px hbtn" id="btnSnd"></div>
    <div class="pill px hbtn" id="btnSpeed"></div>
    <div class="pill px hbtn" id="btnPause"></div>
 </div>

const CATART=(()=>{

// Every cat is painted from shaded primitives on a 48x38 grid, back to front:
//  * each material has a 5-tone hue-shifted ramp (violet shadows -> warm highlights) + its own outline colours
//  * one light (upper-left, a touch frontal): tones come from the surface normal of every primitive
//  * parts drawn over other parts get a 1px "inner line" in their darkest tone (clean overlaps, no mush)
//  * an isolated-pixel cleanup removes single stray tones; outline is selective: lit side lighter, shadow side darkest

// idle x12 (breathing + blink), kb, back, loaf, sleep. Canvas sizes are fixed per cat, feet on the bottom row.

   let t=v>.8?4:v>.47?3:v>.08?2:v>-.32?1:0;if(o.tmax!=null)t=Math.min(t,o.tmax);if(o.tmin!=null)t=Math.max(t,o.tmin);if(o.tfn)t=o.tfn(t,Math.round(mx),Math.round(my),n);pts.push([x,y,t]);}

// ===== shared quadruped body (archer / ninja) =====

 const tw=Math.sin(p.tail||0);
 if(o.tail)o.tail(G,bx,by,tw);
 const lg=p.legs||[[0,0],[0,0],[0,0],[0,0]],top=by+1;
 if(!p.loaf){leg(bx-2.5+lg[0][0],top,lg[0][1],-.55);leg(bx+4.5+lg[1][0],top,lg[1][1],-.55);}
 G.ell(bx,by+.5,brx,bry,F,{bias:-.15,line:true,lineSides:['-1,0','0,-1']});
 if(o.bodyMarks)o.bodyMarks(G,bx,by);
 if(!p.loaf){leg(bx-3.6+lg[2][0],top+1,lg[2][1],-.05,true);leg(bx+3.4+lg[3][0],top+1,lg[3][1],-.05,true);}
 else{G.tube([[bx-6,by+3,1.6],[bx-2,by+4,1.4],[bx+3,by+4,1.3]],F,{bias:-.1,line:true});}
 const hx=Math.round(bx+6+(p.lean||0)),hy=Math.round(by-(o.hUp||7.5)+(p.hb||0));
 return{bx,by,hx,hy,tw};}
function CAT3_eyes(p){return p.blink?(p.blink==='half'?'half':'closed'):(p.eyes||'open');}

// Effects from pixelfx (bundled above as PFX, see fx/build.mjs) draw into their own 320x180 frame, which is laid
// over the canvas in two passes: color pixels normally, then the light buffer with 'lighter', so glows brighten
// the real scene under them. Seeds come from a counter, never from R(), so gameplay randomness is unchanged.
// v1.2 global VFX switch (HUD ✨ button, saved): on = every pixelfx effect; off = exactly the v1.1 look and code paths.
let vfxOn=true;try{vfxOn=localStorage.getItem('pml_vfx')!=='0';}catch(e){}
function fxOn(){return vfxOn&&!!window.PFX;}
function startWeather(){if(!G||!fxOn()||G.wx.length)return;const th=G.bg.theme,n=th==='meadow'?'blossoms':th==='canyon'?'leaves':'shootingStars',org=PFX.FX[n].meta.origin;spawnFx(G.wx,n,org[0],org[1],{},true);}
function setVfx(on){vfxOn=!!on;try{localStorage.setItem('pml_vfx',vfxOn?'1':'0');}catch(e){}
  if(G){if(vfxOn)startWeather();else{G.fx.length=0;G.wx.length=0;G.fxq.length=0;}}vfxBtn();}

// both buffers are copied whole; light strength is applied as the alpha of the 'lighter' pass.

const fxAny=a=>{for(let i=0;i<a.length;i++)if(a[i])return true;return false;};

  p=p*p*(3-2*p);

  const cover=mode===1?1:mode===0?p:1-p;const a=Math.max(0,Math.min(1,(cover-.72)/.22));
  if(a>0){wctx.globalAlpha=a;const bob=mode===1?0:Math.round((1-cover)*4);wctx.drawImage(HEART,0,0,HEART.width,HEART.height,Wc/2-HEART.width,Hc/2-HEART.height-3+bob,HEART.width*2,HEART.height*2);wctx.globalAlpha=1;}

  if(LIVE_MODE){
    acc+=dt;
    while(acc>=STEP){
      window.pmlLive.step(STEP);
      acc-=STEP;
    }
    if(draw){render();window.pmlLive.paint(dt);}
    return;
  }
  if(TR){TR.t+=dt;if(!TR.sw&&TR.t>=WIPE.in){TR.sw=true;applyView(TR.to);}
    if(TR.t>=WIPE.in+WIPE.hold+WIPE.out){TR=null;wipeCv.style.display='none';$('wipeLbl').style.opacity=0;}}
  // Battle simulates ONLY while its view is showing (and not mid-wipe): units, spawns, timers, cooldowns, cannon all freeze in the park.
  if(VIEW==='battle'&&!TR&&G&&!paused){acc+=dt*speed;let n=0;while(acc>=STEP&&n<10){update(STEP);acc-=STEP;n++;}}
  // Cat Paradise runs while shown (full ♥) and keeps playing in the background during a LIVE battle (half ♥).
  // It idles on the stage menu / pause / result screens, so no idle farming outside the two views.
  const live=G&&!G.over&&!paused;const parkRun=VIEW==='park'||(VIEW==='battle'&&live&&!TR);

    Wallet.rate+=(Wallet._tick/Math.max(dt,1e-3)-Wallet.rate)*Math.min(1,dt/15);}
  if(draw){if(VIEW==='battle')render();else if(window.PARK)PARK.draw();updateUI();drawWipe();}
}

function Painter(w,h){this.w=w;this.h=h;this.g=Array.from({length:h},()=>Array(w).fill('.'));}
Painter.prototype.px=function(x,y,ch){x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<this.w&&y<this.h)this.g[y][x]=ch;return this;};
Painter.prototype.rect=function(x,y,w,h,ch){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)this.px(i,j,ch);return this;};
Painter.prototype.ell=function(cx,cy,rx,ry,ch,fn){for(let j=0;j<this.h;j++)for(let i=0;i<this.w;i++){const dx=(i+.5-cx)/rx,dy=(j+.5-cy)/ry;if(dx*dx+dy*dy<=1)this.px(i,j,fn?fn(dx,dy,i,j):ch);}return this;};
Painter.prototype.ellR=function(cx,cy,rx,ry,a,ch,fn){const ca=Math.cos(a),sa=Math.sin(a);for(let j=0;j<this.h;j++)for(let i=0;i<this.w;i++){const X=i+.5-cx,Y=j+.5-cy,u=(X*ca+Y*sa)/rx,v=(-X*sa+Y*ca)/ry;if(u*u+v*v<=1)this.px(i,j,fn?fn(u,v,i,j):ch);}return this;};
Painter.prototype.get=function(x,y){return (x>=0&&y>=0&&x<this.w&&y<this.h)?this.g[y][x]:'.';};
Painter.prototype.outline=function(ch='k'){const add=[];for(let j=0;j<this.h;j++)for(let i=0;i<this.w;i++){if(this.g[j][i]!=='.')continue;if([[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>{const c=this.get(i+a,j+b);return c!=='.'&&c!==ch;}))add.push([i,j]);}add.forEach(([i,j])=>this.g[j][i]=ch);return this;};
Painter.prototype.rows=function(){return this.g.map(r=>r.join(''));};
Painter.prototype.bake=function(pal=FPAL,flip=false){const[c,x]=mkCanvas(this.w,this.h);for(let j=0;j<this.h;j++)for(let i=0;i<this.w;i++){const col=pal[this.g[j][i]];if(col){x.fillStyle=col;x.fillRect(flip?this.w-1-i:i,j,1,1);}}return c;};
